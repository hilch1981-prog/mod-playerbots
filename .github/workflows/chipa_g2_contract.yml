name: Chipa G2 Bridge Contract

on:
  push:
    branches:
      - mop-5.4.8-v2
    paths:
      - chipa_module.cmake
      - src/chipa/**
      - src/Bot/Engine/PlayerbotAIBase.cpp
      - tests/chipa/**
      - tools/chipa/check_g2_bridge_contract.py
      - tools/chipa/check_g2_donor_backend_contract.py
      - .github/workflows/chipa_g2_contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify G2 bridge architecture contract
        run: python3 tools/chipa/check_g2_bridge_contract.py

      - name: Verify staged donor G2 backend contract
        run: python3 tools/chipa/check_g2_donor_backend_contract.py

      - name: Compile adapter contract harness
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Isrc/chipa \
            src/chipa/PlayerLifecycleBridge.cpp \
            src/chipa/PlayerUpdateBridge.cpp \
            src/chipa/PlayerUpdateAdapter.cpp \
            tests/chipa/player_update_adapter_test.cpp \
            -o /tmp/chipa-player-update-adapter-test

      - name: Run adapter contract harness
        run: /tmp/chipa-player-update-adapter-test
