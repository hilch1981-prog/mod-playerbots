name: Chipa G2 Bridge Contract

on:
  push:
    branches:
      - mop-5.4.8-v2
    paths:
      - chipa_module.cmake
      - src/chipa/**
      - src/Script/Playerbots.cpp
      - src/Bot/PlayerbotAI.cpp
      - src/Bot/PlayerbotMgr.cpp
      - src/Bot/Engine/PlayerbotAIBase.cpp
      - src/Bot/Debug/PerfMonitor.cpp
      - tests/chipa/**
      - tools/chipa/check_g2_bridge_contract.py
      - tools/chipa/check_g2_donor_backend_contract.py
      - tools/chipa/check_skyfire_runtime_contract.py
      - tools/chipa/audit_objectguid_compat.py
      - .github/workflows/chipa_g2_contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Checkout Chipa SkyFire runtime baseline
        uses: actions/checkout@v4
        with:
          repository: hilch1981-prog/MOP_V2_Repack
          ref: repack-main
          path: .chipa-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Verify live SkyFire runtime API contract
        run: python3 tools/chipa/check_skyfire_runtime_contract.py .chipa-runtime

      - name: Inventory ObjectGuid compatibility blockers
        run: python3 tools/chipa/audit_objectguid_compat.py .chipa-runtime

      - name: Verify G2 bridge architecture contract
        run: python3 tools/chipa/check_g2_bridge_contract.py

      - name: Verify staged donor G2 backend contract
        run: python3 tools/chipa/check_g2_donor_backend_contract.py

      - name: Compile adapter contract harness
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Isrc/chipa \
            src/chipa/PlayerLifecycleBridge.cpp \
            src/chipa/PlayerUpdateBridge.cpp \
            src/chipa/PlayerUpdateAdapter.cpp \
            tests/chipa/player_update_adapter_test.cpp \
            -o /tmp/chipa-player-update-adapter-test

      - name: Run adapter contract harness
        run: /tmp/chipa-player-update-adapter-test
