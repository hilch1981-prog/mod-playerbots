name: Chipa one-shot adapt chat GUID counters

on:
  push:
    branches:
      - mop-5.4.8-v2
    paths:
      - .github/workflows/chipa-one-shot-adapt-chat-guid-counters.yml

permissions:
  contents: write

jobs:
  adapt-chat-guid-counters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: mop-5.4.8-v2
          fetch-depth: 0

      - name: Replace packet ObjectGuid counters with target low-part helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Bot/PlayerbotAI.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'QueueChatResponse(ChatQueuedReply{msgtype, guid1.GetCounter(), guid2.GetCounter(), message,'
          new = ('QueueChatResponse(ChatQueuedReply{msgtype, GUID_LOPART(static_cast<uint64>(guid1)), '
                 'GUID_LOPART(static_cast<uint64>(guid2)), message,')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one chat GUID counter block, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          grep -F 'GUID_LOPART(static_cast<uint64>(guid1))' src/Bot/PlayerbotAI.cpp
          grep -F 'GUID_LOPART(static_cast<uint64>(guid2))' src/Bot/PlayerbotAI.cpp
          if grep -F '.GetCounter()' src/Bot/PlayerbotAI.cpp; then
            echo 'modern ObjectGuid GetCounter() remains in PlayerbotAI.cpp' >&2
            exit 1
          fi

      - name: Commit adaptation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chipa-one-shot-adapt-chat-guid-counters.yml
          git add src/Bot/PlayerbotAI.cpp
          git diff --cached --check
          git commit -m 'compat(chipa): use SkyFire low part for chat GUIDs'
          git push origin HEAD:mop-5.4.8-v2
