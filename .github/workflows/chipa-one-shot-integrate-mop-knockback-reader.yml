name: Chipa one-shot integrate MoP knockback reader

on:
  push:
    branches:
      - mop-5.4.8-v2
    paths:
      - .github/workflows/chipa-one-shot-integrate-mop-knockback-reader.yml

permissions:
  contents: write

jobs:
  integrate-knockback-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: mop-5.4.8-v2
          fetch-depth: 0

      - name: Replace remaining donor packed knockback parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Bot/PlayerbotAI.cpp')
          text = path.read_text(encoding='utf-8')
          old = '            p >> guid.ReadAsPacked() >> counter >> vcos >> vsin >> horizontalSpeed >> verticalSpeed;\n'
          new = (
              '            if (!chipa::mop548::ReadMoveKnockBackForGuid(p, guid, bot->GetGUID(), counter, vcos, vsin,\n'
              '                                                        horizontalSpeed, verticalSpeed))\n'
              '                return;\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one donor knockback packed parser, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          grep -F 'ReadMoveKnockBackForGuid(p, guid, bot->GetGUID(), counter, vcos, vsin,' src/Bot/PlayerbotAI.cpp
          if grep -F 'p >> guid.ReadAsPacked() >> counter >> vcos >> vsin >> horizontalSpeed >> verticalSpeed;' src/Bot/PlayerbotAI.cpp; then
            echo 'donor packed knockback parser still present' >&2
            exit 1
          fi

      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chipa-one-shot-integrate-mop-knockback-reader.yml
          git add src/Bot/PlayerbotAI.cpp
          git diff --cached --check
          git commit -m 'compat(chipa): use target-native knockback reader in PlayerbotAI'
          git push origin HEAD:mop-5.4.8-v2
