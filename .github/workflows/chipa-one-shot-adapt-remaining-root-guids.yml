name: Chipa one-shot adapt remaining root GUID helpers

on:
  push:
    branches:
      - mop-5.4.8-v2
    paths:
      - .github/workflows/chipa-one-shot-adapt-remaining-root-guids.yml

permissions:
  contents: write

jobs:
  adapt-root-guids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: mop-5.4.8-v2
          fetch-depth: 0

      - name: Replace remaining audited modern GUID helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ai_path = Path('src/Bot/PlayerbotAI.cpp')
          ai = ai_path.read_text(encoding='utf-8')
          old_ai = 'if (guid1.IsEmpty() || p.size() > p.DEFAULT_SIZE)'
          new_ai = 'if (static_cast<uint64>(guid1) == 0 || p.size() > p.DEFAULT_SIZE)'
          if ai.count(old_ai) != 1:
              raise SystemExit(f'expected one PlayerbotAI guid1.IsEmpty(), found {ai.count(old_ai)}')
          ai = ai.replace(old_ai, new_ai, 1)
          ai_path.write_text(ai, encoding='utf-8')

          mgr_path = Path('src/Bot/PlayerbotMgr.cpp')
          mgr = mgr_path.read_text(encoding='utf-8')

          include_anchor = '#include "ObjectAccessor.h"\n'
          if '#include "ObjectDefines.h"\n' not in mgr:
              if mgr.count(include_anchor) != 1:
                  raise SystemExit(f'expected one ObjectAccessor include anchor, found {mgr.count(include_anchor)}')
              mgr = mgr.replace(include_anchor, include_anchor + '#include "ObjectDefines.h"\n', 1)

          expected_counts = {
              'ObjectGuid::Empty': 1,
              'guid.IsEmpty()': 1,
              'guid.IsPlayer()': 1,
              'guid.GetCounter()': 4,
              'playerGuid.GetCounter()': 1,
              'ObjectGuid::LowType lowguid': 1,
          }
          for token, expected in expected_counts.items():
              count = mgr.count(token)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrence(s) of {token!r}, found {count}')

          mgr = mgr.replace('ObjectGuid::Empty', 'ObjectGuid()')
          mgr = mgr.replace('guid.IsEmpty()', 'static_cast<uint64>(guid) == 0')
          mgr = mgr.replace('guid.IsPlayer()', 'IS_PLAYER_GUID(static_cast<uint64>(guid))')
          mgr = mgr.replace('guid.GetCounter()', 'GUID_LOPART(static_cast<uint64>(guid))')
          mgr = mgr.replace('playerGuid.GetCounter()', 'GUID_LOPART(static_cast<uint64>(playerGuid))')
          mgr = mgr.replace('ObjectGuid::LowType lowguid', 'uint32 lowguid')

          for forbidden in ('ObjectGuid::Empty', '.IsEmpty()', '.IsPlayer()', '.GetCounter()', 'ObjectGuid::LowType'):
              if forbidden in mgr:
                  raise SystemExit(f'forbidden modern GUID marker remains in PlayerbotMgr.cpp: {forbidden}')

          mgr_path.write_text(mgr, encoding='utf-8')
          PY

          grep -F 'static_cast<uint64>(guid1) == 0' src/Bot/PlayerbotAI.cpp
          grep -F '#include "ObjectDefines.h"' src/Bot/PlayerbotMgr.cpp
          grep -F 'IS_PLAYER_GUID(static_cast<uint64>(guid))' src/Bot/PlayerbotMgr.cpp
          grep -F 'GUID_LOPART(static_cast<uint64>(playerGuid))' src/Bot/PlayerbotMgr.cpp
          grep -F 'uint32 lowguid = GUID_LOPART(static_cast<uint64>(guid));' src/Bot/PlayerbotMgr.cpp
          grep -F 'ProcessBotCommand(cmdStr, member, ObjectGuid(), true, -1, -1)' src/Bot/PlayerbotMgr.cpp

      - name: Commit adaptation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chipa-one-shot-adapt-remaining-root-guids.yml
          git add src/Bot/PlayerbotAI.cpp src/Bot/PlayerbotMgr.cpp
          git diff --cached --check
          git commit -m 'compat(chipa): remove audited modern GUID helpers from root closure'
          git push origin HEAD:mop-5.4.8-v2
