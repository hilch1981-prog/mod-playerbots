name: Chipa one-shot integrate MoP emote reader

on:
  push:
    branches:
      - mop-5.4.8-v2
    paths:
      - .github/workflows/chipa-one-shot-integrate-mop-emote-reader.yml

permissions:
  contents: write

jobs:
  integrate-emote-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: mop-5.4.8-v2
          fetch-depth: 0

      - name: Replace donor emote ObjectGuid classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Bot/PlayerbotAI.cpp')
          text = path.read_text(encoding='utf-8')

          include_anchor = '#include "ObjectAccessor.h"\n'
          if '#include "ObjectDefines.h"\n' not in text:
              if text.count(include_anchor) != 1:
                  raise SystemExit(f'expected one ObjectAccessor include anchor, found {text.count(include_anchor)}')
              text = text.replace(include_anchor, include_anchor + '#include "ObjectDefines.h"\n', 1)

          old = '''            WorldPacket p(packet);\n            ObjectGuid source;\n            uint32 emoteId;\n            p.rpos(0);\n            p >> emoteId >> source;\n            if (source.IsPlayer())\n                botOutgoingPacketHandlers.AddPacket(packet);\n'''
          new = '''            WorldPacket p(packet);\n            uint64 source;\n            uint32 emoteId;\n            p.rpos(0);\n            chipa::mop548::ReadEmote(p, emoteId, source);\n            if (IS_PLAYER_GUID(source))\n                botOutgoingPacketHandlers.AddPacket(packet);\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one donor emote ObjectGuid block, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          grep -F '#include "ObjectDefines.h"' src/Bot/PlayerbotAI.cpp
          grep -F 'chipa::mop548::ReadEmote(p, emoteId, source);' src/Bot/PlayerbotAI.cpp
          grep -F 'if (IS_PLAYER_GUID(source))' src/Bot/PlayerbotAI.cpp
          if grep -F 'source.IsPlayer()' src/Bot/PlayerbotAI.cpp; then
            echo 'donor source.IsPlayer() remains present' >&2
            exit 1
          fi

      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chipa-one-shot-integrate-mop-emote-reader.yml
          git add src/Bot/PlayerbotAI.cpp
          git diff --cached --check
          git commit -m 'compat(chipa): use raw SkyFire GUID for emote packets'
          git push origin HEAD:mop-5.4.8-v2
