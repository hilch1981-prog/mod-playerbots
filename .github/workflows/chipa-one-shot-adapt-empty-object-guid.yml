name: Chipa one-shot adapt empty ObjectGuid

on:
  push:
    branches:
      - mop-5.4.8-v2
    paths:
      - .github/workflows/chipa-one-shot-adapt-empty-object-guid.yml

permissions:
  contents: write

jobs:
  adapt-empty-object-guid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: mop-5.4.8-v2
          fetch-depth: 0

      - name: Replace modern ObjectGuid Empty sentinel with target-native forms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Bot/PlayerbotAI.cpp')
          text = path.read_text(encoding='utf-8')

          exact_counts = {
              'aiObjectContext->GetValue<ObjectGuid>("pull target")->Set(ObjectGuid::Empty);': 2,
              'aiObjectContext->GetValue<ObjectGuid>("pull strategy target")->Set(ObjectGuid::Empty);': 2,
              'ObjectGuid mainTank = ObjectGuid();': 1,
              'if (mainTank != ObjectGuid::Empty)': 1,
              'void PlayerbotAI::ImbueItem(Item* item) { ImbueItem(item, TARGET_FLAG_NONE, ObjectGuid::Empty); }': 1,
          }
          for token, expected in exact_counts.items():
              count = text.count(token)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrence(s) of {token!r}, found {count}')

          ternary = ': ObjectGuid::Empty);'
          if text.count(ternary) != 1:
              raise SystemExit(f'expected one text-emote empty GUID ternary, found {text.count(ternary)}')

          text = text.replace(
              'aiObjectContext->GetValue<ObjectGuid>("pull target")->Set(ObjectGuid::Empty);',
              'aiObjectContext->GetValue<ObjectGuid>("pull target")->Set(ObjectGuid());',
          )
          text = text.replace(
              'aiObjectContext->GetValue<ObjectGuid>("pull strategy target")->Set(ObjectGuid::Empty);',
              'aiObjectContext->GetValue<ObjectGuid>("pull strategy target")->Set(ObjectGuid());',
          )
          text = text.replace('ObjectGuid mainTank = ObjectGuid();', 'uint64 mainTank = 0;')
          text = text.replace('if (mainTank != ObjectGuid::Empty)', 'if (mainTank != 0)')
          text = text.replace(ternary, ': uint64(0));', 1)
          text = text.replace(
              'void PlayerbotAI::ImbueItem(Item* item) { ImbueItem(item, TARGET_FLAG_NONE, ObjectGuid::Empty); }',
              'void PlayerbotAI::ImbueItem(Item* item) { ImbueItem(item, TARGET_FLAG_NONE, ObjectGuid()); }',
              1,
          )

          if 'ObjectGuid::Empty' in text:
              raise SystemExit('ObjectGuid::Empty remains in PlayerbotAI.cpp after target-native adaptation')

          path.write_text(text, encoding='utf-8')
          PY

          grep -F 'Set(ObjectGuid());' src/Bot/PlayerbotAI.cpp
          grep -F 'uint64 mainTank = 0;' src/Bot/PlayerbotAI.cpp
          grep -F ': uint64(0));' src/Bot/PlayerbotAI.cpp
          grep -F 'TARGET_FLAG_NONE, ObjectGuid());' src/Bot/PlayerbotAI.cpp
          if grep -F 'ObjectGuid::Empty' src/Bot/PlayerbotAI.cpp; then
            echo 'modern ObjectGuid::Empty remains in PlayerbotAI.cpp' >&2
            exit 1
          fi

      - name: Commit adaptation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chipa-one-shot-adapt-empty-object-guid.yml
          git add src/Bot/PlayerbotAI.cpp
          git diff --cached --check
          git commit -m 'compat(chipa): use target-native empty GUID forms in PlayerbotAI'
          git push origin HEAD:mop-5.4.8-v2
